<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Three linked database tables and a SQL query">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="1.5"/></pattern>
    <radialGradient id="glow" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#9a76f4" stop-opacity=".35"/><stop offset="1" stop-color="#9a76f4" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="520" fill="url(#grid)"/><rect width="800" height="520" fill="url(#glow)"/>
  <!-- relation lines -->
  <g fill="none" stroke="#ffe93a" stroke-width="4" stroke-dasharray="3 10" stroke-linecap="round">
    <path d="M250 150 C330 150 330 250 410 250"/><path d="M250 330 C330 330 330 250 410 250"/><path d="M590 250 C640 250 640 380 560 392"/>
  </g>
  <!-- customers table -->
  <g transform="translate(60 78)">
    <rect width="190" height="150" rx="16" fill="#03aae6" transform="translate(7 7)" opacity=".0"/>
    <rect width="190" height="150" rx="16" fill="#f7f2e8" stroke="#191526" stroke-width="4"/>
    <path d="M0 16a16 16 0 0 1 16-16h158a16 16 0 0 1 16 16v26H0z" fill="#03aae6" stroke="#191526" stroke-width="4"/>
    <text x="16" y="31" font-family="Syne, sans-serif" font-weight="800" font-size="15" fill="#191526">customers</text>
    <g fill="#191526" opacity=".75"><rect x="16" y="62" width="70" height="8" rx="4"/><rect x="16" y="86" width="110" height="8" rx="4"/><rect x="16" y="110" width="90" height="8" rx="4"/></g>
    <circle cx="164" cy="66" r="6" fill="#ffe93a" stroke="#191526" stroke-width="2.5"/>
  </g>
  <!-- products table -->
  <g transform="translate(60 290)">
    <rect width="190" height="150" rx="16" fill="#f7f2e8" stroke="#191526" stroke-width="4"/>
    <path d="M0 16a16 16 0 0 1 16-16h158a16 16 0 0 1 16 16v26H0z" fill="#c7e86b" stroke="#191526" stroke-width="4"/>
    <text x="16" y="31" font-family="Syne, sans-serif" font-weight="800" font-size="15" fill="#191526">products</text>
    <g fill="#191526" opacity=".75"><rect x="16" y="62" width="100" height="8" rx="4"/><rect x="16" y="86" width="64" height="8" rx="4"/><rect x="16" y="110" width="120" height="8" rx="4"/></g>
    <circle cx="164" cy="66" r="6" fill="#ffe93a" stroke="#191526" stroke-width="2.5"/>
  </g>
  <!-- orders table -->
  <g transform="translate(410 170)">
    <rect width="190" height="160" rx="16" fill="#191526" transform="translate(8 8)"/>
    <rect width="190" height="160" rx="16" fill="#f7f2e8" stroke="#191526" stroke-width="4"/>
    <path d="M0 16a16 16 0 0 1 16-16h158a16 16 0 0 1 16 16v26H0z" fill="#f65456" stroke="#191526" stroke-width="4"/>
    <text x="16" y="31" font-family="Syne, sans-serif" font-weight="800" font-size="15" fill="#191526">orders</text>
    <g fill="#191526" opacity=".75"><rect x="16" y="62" width="90" height="8" rx="4"/><rect x="16" y="86" width="124" height="8" rx="4"/><rect x="16" y="110" width="76" height="8" rx="4"/><rect x="16" y="134" width="104" height="8" rx="4"/></g>
    <circle cx="164" cy="66" r="6" fill="#ffe93a" stroke="#191526" stroke-width="2.5"/>
  </g>
  <!-- query card -->
  <g transform="translate(440 360) rotate(-3)">
    <rect width="300" height="110" rx="16" fill="#ffe93a" transform="translate(7 7)"/>
    <rect width="300" height="110" rx="16" fill="#191526" stroke="#f7f2e8" stroke-width="3"/>
    <g font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="700">
      <text x="20" y="34" fill="#f65456">SELECT <tspan fill="#f7f2e8">SUM(revenue)</tspan></text>
      <text x="20" y="60" fill="#03aae6">FROM <tspan fill="#f7f2e8">orders o</tspan></text>
      <text x="20" y="86" fill="#c7e86b">JOIN <tspan fill="#f7f2e8">customers c</tspan><tspan fill="#ffe93a"> ▍</tspan></text>
    </g>
  </g>
</svg>
