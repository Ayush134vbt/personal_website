<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Line chart of daily bike demand trending upward">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#fff" opacity=".18"/></pattern>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#323cfb" stop-opacity=".28"/><stop offset="1" stop-color="#323cfb" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#dots)"/>
  <!-- chart card -->
  <rect x="70" y="70" width="660" height="380" rx="22" fill="#191526" transform="translate(10 10)"/>
  <rect x="70" y="70" width="660" height="380" rx="22" fill="#f7f2e8" stroke="#191526" stroke-width="5"/>
  <text x="102" y="116" font-family="Syne, sans-serif" font-weight="800" font-size="24" fill="#191526" letter-spacing="-1">Daily Bike Demand</text>
  <g font-family="DM Sans, sans-serif" font-weight="700" font-size="11" letter-spacing="1.5">
    <rect x="590" y="94" width="108" height="28" rx="14" fill="#ffe93a" stroke="#191526" stroke-width="2.5"/>
    <text x="644" y="112" text-anchor="middle" fill="#191526">+38% TREND</text>
  </g>
  <!-- grid -->
  <g stroke="#191526" stroke-opacity=".14" stroke-width="2">
    <line x1="102" y1="190" x2="698" y2="190"/><line x1="102" y1="250" x2="698" y2="250"/>
    <line x1="102" y1="310" x2="698" y2="310"/><line x1="102" y1="370" x2="698" y2="370"/>
  </g>
  <line x1="102" y1="410" x2="698" y2="410" stroke="#191526" stroke-width="4" stroke-linecap="round"/>
  <!-- bars (hourly) -->
  <g fill="#9a76f4" opacity=".5">
    <rect x="120" y="362" width="18" height="48" rx="4"/><rect x="170" y="340" width="18" height="70" rx="4"/>
    <rect x="220" y="352" width="18" height="58" rx="4"/><rect x="270" y="318" width="18" height="92" rx="4"/>
    <rect x="320" y="330" width="18" height="80" rx="4"/><rect x="370" y="290" width="18" height="120" rx="4"/>
    <rect x="420" y="300" width="18" height="110" rx="4"/><rect x="470" y="262" width="18" height="148" rx="4"/>
    <rect x="520" y="276" width="18" height="134" rx="4"/><rect x="570" y="232" width="18" height="178" rx="4"/>
    <rect x="620" y="214" width="18" height="196" rx="4"/><rect x="670" y="196" width="18" height="214" rx="4"/>
  </g>
  <!-- trend -->
  <path d="M129 350 L179 322 L229 336 L279 296 L329 308 L379 262 L429 276 L479 232 L529 246 L579 200 L629 178 L679 158 L679 410 L129 410 Z" fill="url(#area)"/>
  <path d="M129 350 L179 322 L229 336 L279 296 L329 308 L379 262 L429 276 L479 232 L529 246 L579 200 L629 178 L679 158" fill="none" stroke="#323cfb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ffe93a" stroke="#191526" stroke-width="3.5">
    <circle cx="179" cy="322" r="8"/><circle cx="279" cy="296" r="8"/><circle cx="379" cy="262" r="8"/>
    <circle cx="479" cy="232" r="8"/><circle cx="579" cy="200" r="8"/>
  </g>
  <circle cx="679" cy="158" r="12" fill="#f65456" stroke="#191526" stroke-width="4"/>
  <!-- bicycle sticker -->
  <g transform="translate(560 330) rotate(-8)">
    <rect x="-20" y="-20" width="190" height="126" rx="20" fill="#191526" transform="translate(7 7)"/>
    <rect x="-20" y="-20" width="190" height="126" rx="20" fill="#ffe93a" stroke="#191526" stroke-width="4.5"/>
    <g fill="none" stroke="#191526" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="26" cy="68" r="22"/><circle cx="126" cy="68" r="22"/>
      <path d="M26 68 L58 30 L100 30 L126 68 M58 30 L76 68 L26 68 M76 68 L100 30"/>
      <path d="M52 22 L68 22 M96 20 L108 20 L100 30"/>
    </g>
    <circle cx="76" cy="68" r="5" fill="#f65456" stroke="#191526" stroke-width="3"/>
  </g>
</svg>
